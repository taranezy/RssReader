<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- RSS feed icon in white -->
  <circle cx="25" cy="75" r="8" fill="white"/>
  
  <!-- Small arc -->
  <path d="M 25 58 A 25 25 0 0 1 50 83" stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>
  
  <!-- Large arc -->
  <path d="M 25 38 A 45 45 0 0 1 70 83" stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
