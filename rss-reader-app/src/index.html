<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Check dark mode synchronously BEFORE page renders
    (function() {
      try {
        var isDark = localStorage.getItem('darkMode') === 'true';
        if (isDark) {
          // Write style tag directly into the document as it's being parsed
          document.write('<style>html,body{background-color:#1a1a1a!important;color:#e8e8e8!important}</style>');
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* Default light mode */
    html, body {
      background-color: #f5f7fa;
      color: #333;
      margin: 0;
    }
    /* Dark mode overrides */
    html.dark-mode, html.dark-mode body {
      background-color: #1a1a1a !important;
      color: #e8e8e8 !important;
    }
  </style>
  <title>RSS Reader</title>
  <base href="/streamlet/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Enable Angular DevTools detection
    window['ngDevMode'] = true;
    
    // Android WebView Interface Helper
    window.notifyAngularAuthReady = function() {
      var event = new CustomEvent('androidAuthReady');
      window.dispatchEvent(event);
    };
    
    // Debug helper to check localStorage from Android
    window.checkAndroidAuth = function() {
      return {
        skipLogin: localStorage.getItem('streamlet_skip_login'),
        hasToken: !!localStorage.getItem('streamlet_id_token'),
        email: localStorage.getItem('streamlet_email'),
        isNativeApp: localStorage.getItem('streamlet_native_app')
      };
    };
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
