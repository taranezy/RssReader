<header class="app-header" [style.background]="getHeaderGradient()">
  <div class="header-container">
    <div class="header-left">
      <h1 class="app-title">RSS Reader</h1>
      <div class="view-toggle">
        <button 
          class="view-btn"
          [class.active]="currentView === 'list'"
          (click)="switchView('list')"
          title="List View">
          ☰ List
        </button>
        <button 
          class="view-btn"
          [class.active]="currentView === 'grid'"
          (click)="switchView('grid')"
          title="Grid View">
          ⊞ Grid
        </button>
        <button 
          class="view-btn"
          [class.active]="currentView === 'news'"
          (click)="switchView('news')"
          title="News Look">
          📰 News
        </button>
        <button 
          class="view-btn"
          [class.active]="currentView === 'suggested'"
          (click)="switchView('suggested')"
          title="Suggested Feeds">
          ✨ Suggested
        </button>
      </div>
    </div>

    <div class="header-right">
      <div class="filter-controls">
        <button 
          class="filter-btn"
          [class.active]="preferences.showOnlyUnread"
          (click)="toggleUnreadFilter()"
          title="Show only unread items">
          {{ preferences.showOnlyUnread ? '● Unread Only' : '○ All Items' }}
        </button>

        <div class="feed-filter" *ngIf="feeds.length > 0">
          <button class="filter-btn dropdown-toggle" (click)="toggleFeedDropdown()">
            {{ preferences.selectedFeeds.length === 0 ? 'All Feeds' : preferences.selectedFeeds.length + ' Selected' }}
            <span class="arrow" [class.rotated]="showFeedDropdown">▼</span>
          </button>
          
          <div class="feed-dropdown" [class.show]="showFeedDropdown">
            <div class="dropdown-header">
              <span>Filter by Feed</span>
              <button 
                class="clear-btn"
                (click)="clearFeedFilter(); $event.stopPropagation()"
                *ngIf="preferences.selectedFeeds.length > 0">
                Clear
              </button>
            </div>
            <div class="feed-list">
              <label 
                class="feed-checkbox"
                *ngFor="let feed of feeds"
                (click)="$event.stopPropagation()">
                <input 
                  type="checkbox"
                  [checked]="isFeedSelected(feed.id)"
                  (change)="toggleFeedFilter(feed.id)"
                />
                <span 
                  class="feed-color-dot"
                  [style.background-color]="feed.color">
                </span>
                <span class="feed-name">{{ feed.title }}</span>
              </label>
            </div>
          </div>
        </div>

        <button 
          class="action-btn"
          (click)="markAllAsRead()"
          title="Mark all as read">
          ✓ Mark All Read
        </button>
      </div>

      <!-- User Menu -->
      <div class="user-menu" *ngIf="currentUser">
        <button class="user-btn" (click)="toggleUserMenu()" title="User menu">
          <span class="user-icon">👤</span>
          <span class="user-name">{{ currentUser.username }}</span>
        </button>
        
        <div class="user-dropdown" *ngIf="showUserMenu">
          <div class="user-info">
            <div class="user-email">{{ currentUser.email }}</div>
          </div>
          <div class="user-actions">
            <button class="settings-btn" (click)="openSettings()">
              <span>⚙️</span> Settings
            </button>
            <button class="logout-btn" (click)="logout()">
              <span>🚪</span> Logout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Settings Modal -->
<div class="settings-modal-overlay" *ngIf="showSettings" (click)="closeSettings()">
  <div class="settings-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>User Settings</h2>
      <button class="close-btn" (click)="closeSettings()">✕</button>
    </div>

    <div class="modal-content">
      <!-- Header Color Selection -->
      <div class="settings-section">
        <label>Header Color:</label>
        <div class="color-options">
          <button 
            *ngFor="let theme of headerColorThemes"
            class="color-btn"
            [class.active]="userSettings.headerColor === theme.id"
            [style.background]="'linear-gradient(135deg, ' + theme.primary + ' 0%, ' + theme.secondary + ' 100%)'"
            [title]="theme.name"
            (click)="changeHeaderColor(theme.id)">
            <span class="color-name">{{ theme.name }}</span>
          </button>
        </div>
      </div>

      <!-- Font Selection -->
      <div class="settings-section">
        <label>Font:</label>
        <div class="font-options">
          <button 
            *ngFor="let font of availableFonts"
            class="font-btn"
            [class.active]="userSettings.font === font.id"
            [style.fontFamily]="font.family"
            (click)="changeFont(font.id)">
            {{ font.name }}
          </button>
        </div>
      </div>

      <!-- Left Menu Toggle -->
      <div class="settings-section">
        <label>Left Menu:</label>
        <div class="toggle-option">
          <label class="toggle-label">
            <input 
              type="checkbox" 
              [checked]="userSettings.showLeftMenu"
              (change)="toggleLeftMenu($event)">
            <span>Show Left Menu</span>
          </label>
        </div>
      </div>

      <!-- Feed Images Toggle -->
      <div class="settings-section">
        <label>Feed Images:</label>
        <div class="toggle-option">
          <label class="toggle-label">
            <input 
              type="checkbox" 
              [checked]="userSettings.showFeedImages"
              (change)="toggleFeedImages($event)">
            <span>Show Feed Pictures</span>
          </label>
        </div>
      </div>

      <!-- Export/Import Data -->
      <div class="settings-section">
        <label>Data Management:</label>
        <div class="data-management">
          <button class="export-btn" (click)="exportData()">
            📥 Export All Data
          </button>
          <label class="import-btn">
            📤 Import Data
            <input 
              type="file" 
              accept=".xml"
              (change)="onImportFileSelected($event)"
              style="display: none;">
          </label>
          <p class="data-info">
            Export your feeds and settings to XML, or import from a backup file.
            <strong>Warning:</strong> Import will replace all current data!
          </p>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-primary" (click)="closeSettings()">Done</button>
    </div>
  </div>
</div>
