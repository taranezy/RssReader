<div class="app-container">
  <ng-container *ngIf="isAuthenticated$ | async; else loginView">
    <!-- Left Sidebar -->
    <app-feed-manager (sidebarToggled)="onSidebarToggled($event)"></app-feed-manager>
    
    <!-- Main Content Area -->
    <div class="main-layout" [class.sidebar-collapsed]="isSidebarCollapsed">
      <app-header></app-header>
      
      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </ng-container>

  <ng-template #loginView>
    <app-login></app-login>
  </ng-template>
</div>
