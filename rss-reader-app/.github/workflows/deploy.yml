name: Deploy to Andromeda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        run: |
          docker build -t rss-reader:latest .
          docker save rss-reader:latest | gzip > rss-reader-deploy.tar.gz
      
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ANDROMEDA_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_FILE" > .env
      
      - name: Deploy to Andromeda
        env:
          ANDROMEDA_HOST: ${{ secrets.ANDROMEDA_HOST }}
          ANDROMEDA_USER: ${{ secrets.ANDROMEDA_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/rss-reader' }}
        run: |
          # Create directory on server
          ssh ${ANDROMEDA_USER}@${ANDROMEDA_HOST} "mkdir -p ${DEPLOY_PATH}"
          
          # Copy files
          scp rss-reader-deploy.tar.gz docker-compose.yml .env ${ANDROMEDA_USER}@${ANDROMEDA_HOST}:${DEPLOY_PATH}/
          
          # Deploy on server
          ssh ${ANDROMEDA_USER}@${ANDROMEDA_HOST} << 'ENDSSH'
            cd ${DEPLOY_PATH}
            docker load < rss-reader-deploy.tar.gz
            docker-compose down || true
            docker-compose up -d
            rm rss-reader-deploy.tar.gz
            docker-compose ps
          ENDSSH
      
      - name: Verify deployment
        env:
          ANDROMEDA_HOST: ${{ secrets.ANDROMEDA_HOST }}
          ANDROMEDA_USER: ${{ secrets.ANDROMEDA_USER }}
        run: |
          sleep 5
          ssh ${ANDROMEDA_USER}@${ANDROMEDA_HOST} "docker-compose -f /opt/rss-reader/docker-compose.yml ps"
          ssh ${ANDROMEDA_USER}@${ANDROMEDA_HOST} "curl -f http://localhost:3000/api/health || exit 1"
