version: '3.8'

services:
  rss-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss-reader-app
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - rss-data:/app/backend/data
    networks:
      - rss-network

  nginx:
    image: nginx:alpine
    container_name: rss-reader-nginx
    restart: unless-stopped
    ports:
      - "8444:8444"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx-https.conf:/etc/nginx/nginx-https.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - rss-reader
    networks:
      - rss-network
    entrypoint: /bin/sh /entrypoint.sh

  certbot:
    image: certbot/certbot
    container_name: rss-reader-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/renew.sh:/scripts/renew.sh:ro
    entrypoint: /bin/sh /scripts/renew.sh
    healthcheck:
      test: ["CMD", "test", "-f", "/etc/letsencrypt/live"]
      interval: 3600s
      timeout: 10s
      retries: 1
      start_period: 60s

volumes:
  rss-data:
    driver: local

networks:
  rss-network:
    driver: bridge
