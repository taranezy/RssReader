version: '3.8'

# NOTE: This is for development only
# For production with separate nginx, use docker-compose-update.yml in the project root

services:
  rss-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss-reader-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000/}
      - SESSION_SECRET=${SESSION_SECRET:-your-secret-key-change-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
    volumes:
      # Persist database
      - rss-data:/app/backend/data
      # Mount .env file for configuration
      - ./.env:/app/.env:ro
    networks:
      - rss-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  rss-data:
    driver: local

networks:
  rss-network:
    driver: bridge

