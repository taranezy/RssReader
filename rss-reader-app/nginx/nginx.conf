events {
    worker_connections 1024;
}

http {
    upstream rss-reader {
        server rss-reader-app:3000;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name streamlet.taranezy.com;

        # SSL Certificate Configuration
        ssl_certificate /etc/letsencrypt/live/streamlet.taranezy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/streamlet.taranezy.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Client size limits
        client_max_body_size 100M;

        # ACME challenge for certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Static assets - serve directly from frontend build
        location ~ ^/(polyfills|main|styles|favicon|rss-reader-app)/.*\.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|map)$ {
            proxy_pass http://rss-reader;
            proxy_buffering on;
            proxy_cache_bypass 0;
            # Set correct cache headers for static files
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
        
        # Static files with hash in name (polyfills-HASH.js, main-HASH.js, styles-HASH.css)
        location ~ ^/(polyfills|main|styles)-[a-zA-Z0-9]+\.(js|css)$ {
            proxy_pass http://rss-reader;
            proxy_buffering on;
            proxy_cache_bypass 0;
            # Set correct cache headers for static files
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
        
        # Favicon
        location ~ ^/favicon\.(ico|svg)$ {
            proxy_pass http://rss-reader;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API endpoints
        location /api/ {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Original-URL $request_uri;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }

        # RSS Reader frontend and all other routes
        location / {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }
    }
}