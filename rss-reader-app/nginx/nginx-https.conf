events {
    worker_connections 1024;
}
#testing nginx config for multiple services
http {
      upstream rss_reader {
          server rss-reader-app:3000;
      }
  
      upstream portainer {
          server 192.168.100.5:9443;
      }
  
      upstream nextcloud {
          server 192.168.100.5:4443;
      }
  
     upstream jellyfin {
          server 192.168.100.5:8096;
      }
   
      upstream bitwarden {
          server 192.168.100.5:9999;  # or whatever port Bitwarden uses
      }
      
    server {
        listen 443 ssl http2;
        listen 8444 ssl http2;
        server_name taranezy.ddns.net;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/taranezy.ddns.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taranezy.ddns.net/privkey.pem;

        # SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # RSS Reader (root path)
        location / {
            proxy_pass http://rss_reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # Portainer reverse proxy
        location /portainer/ {
            rewrite ^/portainer(/.*)$ $1 break;
            proxy_pass https://portainer;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            
            # SSL verification
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;

            # WebSocket support
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Redirect /portainer to /portainer/
        location = /portainer {
            return 301 /portainer/;
        }

        # RSS Reader via /streamlet path
        location /streamlet/ {
            rewrite ^/streamlet(/.*)$ $1 break;
            proxy_pass http://rss_reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # Redirect /streamlet to /streamlet/
        location = /streamlet {
            return 301 /streamlet/;
        }

        # Portainer WebSocket endpoint
        location /portainer/ws {
            proxy_pass https://portainer/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

          # Nextcloud at /nextcloud
    location /nextcloud/ {
        proxy_pass https://nextcloud/nextcloud/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_ssl_verify off;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }

    # Jellyfin at /jellyfin
    location /jellyfin/ {
        proxy_pass http://jellyfin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }

    }
}