############################
# Nextcloud
############################

server {
    listen 80;
    server_name nextcloud.taranezy.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nextcloud.taranezy.com;

    ssl_certificate     /etc/letsencrypt/live/taranezy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taranezy.com/privkey.pem;

    root /var/www/html;
    client_max_body_size 10240M;

    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass nextcloud-fpm-clean:9000;
    }

    location ~ \.(?:css|js|woff2?|svg|gif|png|jpg|ico)$ {
        try_files $uri /index.php$request_uri;
        access_log off;
        expires 1M;
    }
}

############################
# opencloud.taranezy.com -> OpenCloud container
############################

server {
    listen 80;
    server_name opencloud.taranezy.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name opencloud.taranezy.com;

    ssl_certificate     /etc/letsencrypt/live/taranezy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taranezy.com/privkey.pem;

    location / {
        proxy_pass         http://192.168.100.5:9200;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_buffering    off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}


