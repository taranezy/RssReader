# Nginx configuration for RSS Reader - deployed on Andromeda
# This proxies requests to /streamlet/ to the Docker backend running on localhost:3000
# Place this file in /etc/nginx/conf.d/ on the host
# Filename: /etc/nginx/conf.d/rss-reader-host-proxy.conf

upstream rss_reader_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name taranezy.ddns.net;

    # SSL certificates from Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/taranezy.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taranezy.ddns.net/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logging
    access_log /var/log/nginx/rss-reader-access.log;
    error_log /var/log/nginx/rss-reader-error.log;

    # Root location redirects to /streamlet/
    location = / {
        return 301 https://$server_name/streamlet/;
    }

    # RSS Reader application
    location /streamlet/ {
        proxy_pass http://rss_reader_backend/;
        
        # Forward headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Important for path rewriting - backend expects /api not /streamlet/api
        proxy_set_header X-Script-Name /streamlet;
        
        # Connection settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        
        # Upgrade for WebSocket if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint (optional)
    location /streamlet/health {
        access_log off;
        proxy_pass http://rss_reader_backend/health;
        proxy_http_version 1.1;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name taranezy.ddns.net;

    location / {
        return 301 https://$server_name$request_uri;
    }

    # Allow certbot to renew certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
