events {
    worker_connections 1024;
}

http {
    # Include common configurations
    include /etc/nginx/conf.d/*.conf;

    # Upstream for RSS Reader (container)
    upstream rss-reader {
        server rss-reader:3000;
    }

    # Default server - catch all
    server {
        listen 80 default_server;
        server_name _;
        return 444; # Close connection
    }

    # Streamlet (RSS Reader) - HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name streamlet.taranezy.com;

        ssl_certificate /etc/letsencrypt/live/taranezy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taranezy.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Client size limits
        client_max_body_size 100M;

        # ACME challenge for certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Static assets - serve directly from frontend build
        location ~ ^/(polyfills|main|styles|favicon|rss-reader-app)/.*\.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|map)$ {
            proxy_pass http://rss-reader;
            proxy_buffering on;
            proxy_cache_bypass 0;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Static files with hash in name
        location ~ ^/(polyfills|main|styles)-[a-zA-Z0-9]+\.(js|css)$ {
            proxy_pass http://rss-reader;
            proxy_buffering on;
            proxy_cache_bypass 0;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Favicon
        location ~ ^/favicon\.(ico|svg)$ {
            proxy_pass http://rss-reader;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API endpoints
        location /api/ {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Original-URL $request_uri;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }

        # RSS Reader frontend and all other routes
        location / {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }
    }

    # HTTP to HTTPS redirect for streamlet
    server {
        listen 80;
        server_name streamlet.taranezy.com;
        return 301 https://$host$request_uri;
    }

    # Alternative port for RSS Reader (for development/testing)
    server {
        listen 8444;
        server_name streamlet.taranezy.com;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}