events {
    worker_connections 1024;
}

http {
    # Include common configurations
    include /etc/nginx/conf.d/*.conf;

    # Upstream for RSS Reader (container)
    upstream rss-reader {
        server rss-reader:3000;
    }

    # Default server - catch all
    server {
        listen 80 default_server;
        server_name _;
        return 444; # Close connection
    }

    # OpenCloud - HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name opencloud.taranezy.com;

        ssl_certificate /etc/letsencrypt/live/taranezy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taranezy.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://192.168.100.5:9200;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300;
        }
    }

    # Nextcloud - HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name nextcloud.taranezy.com;

        ssl_certificate /etc/letsencrypt/live/taranezy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taranezy.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # CORS headers to allow requests from OpenCloud
        add_header 'Access-Control-Allow-Origin' 'https://opencloud.taranezy.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Handle OPTIONS requests for CORS
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        root /var/www/html;
        client_max_body_size 10240M;

        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }

        location ~ \.php(?:$|/) {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTPS on;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass 192.168.100.5:9000;
            fastcgi_intercept_errors on;
            fastcgi_request_buffering off;
        }

        location ~ \.(?:css|js|woff2?|svg|gif|png|jpg|ico)$ {
            try_files $uri /index.php$request_uri;
            access_log off;
            expires 1M;
        }
    }

    # Jellyfin - HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name jellyfin.taranezy.com;

        ssl_certificate /etc/letsencrypt/live/taranezy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taranezy.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://192.168.100.5:8096;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300;
        }
    }

    # Portainer - HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name portainer.taranezy.com;

        ssl_certificate /etc/letsencrypt/live/taranezy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taranezy.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass https://192.168.100.5:9443;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300;
        }
    }

    # Streamlet (RSS Reader) - HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name streamlet.taranezy.com;

        ssl_certificate /etc/letsencrypt/live/taranezy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taranezy.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Client size limits
        client_max_body_size 100M;

        # ACME challenge for certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Static assets - serve directly from frontend build
        location ~ ^/(polyfills|main|styles|favicon|rss-reader-app)/.*\.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|map)$ {
            proxy_pass http://rss-reader;
            proxy_buffering on;
            proxy_cache_bypass 0;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Static files with hash in name
        location ~ ^/(polyfills|main|styles)-[a-zA-Z0-9]+\.(js|css)$ {
            proxy_pass http://rss-reader;
            proxy_buffering on;
            proxy_cache_bypass 0;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Favicon
        location ~ ^/favicon\.(ico|svg)$ {
            proxy_pass http://rss-reader;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API endpoints
        location /api/ {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Original-URL $request_uri;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }

        # RSS Reader frontend and all other routes
        location / {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }
    }

    # Vaultwarden - HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name vaultwarden.taranezy.com;

        ssl_certificate /etc/letsencrypt/live/taranezy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taranezy.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://192.168.100.5:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300;
        }
    }

    # HTTP to HTTPS redirects for all domains
    server {
        listen 80;
        server_name nextcloud.taranezy.com opencloud.taranezy.com jellyfin.taranezy.com portainer.taranezy.com streamlet.taranezy.com vaultwarden.taranezy.com;
        return 301 https://$host$request_uri;
    }

    # Alternative port for RSS Reader (for development/testing)
    server {
        listen 8444;
        server_name streamlet.taranezy.com;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}