# Portainer Reverse Proxy Configuration
# Access via: https://192.168.100.5/portainer

upstream portainer {
    server localhost:9443;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL Certificate paths
    ssl_certificate /etc/ssl/taranezy.crt;
    ssl_certificate_key /etc/ssl/taranezy.key;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Client body size limit (for Portainer uploads)
    client_max_body_size 100M;

    # Portainer reverse proxy
    location /portainer/ {
        proxy_pass https://portainer/;
        
        # Headers for WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
        
        # SSL verification - disable for self-signed certificates
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
    }

    # Redirect root to /portainer
    location = / {
        return 301 /portainer/;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
