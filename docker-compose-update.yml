version: '3.8'

# NOTE: Nginx reverse proxy is now managed separately in the nginx-reverse-proxy project
# This docker-compose file only manages the RSS Reader application service

services:
  rss-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss-reader-app
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - rss-data:/app/backend/data
    networks:
      - reverse-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  rss-data:
    driver: local

networks:
  reverse-proxy:
    external: true
