events {
    worker_connections 1024;
}

http {
    upstream rss-reader {
        server rss-reader-app:3000;
    }

    upstream portainer {
        server portainer:9443;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl http2 default_server;
        server_name taranezy.ddns.net;

        # SSL Certificate Configuration
        ssl_certificate /etc/ssl/taranezy_ddns_net.crt;
        ssl_certificate_key /etc/ssl/taranezy.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Client size limits
        client_max_body_size 100M;

        # ACME challenge for certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Portainer access at /portainer
        location /portainer/ {
            proxy_pass https://portainer/;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            
            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;
            
            # SSL verification for backend
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
        }

        # RSS Reader at root
        location / {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            # CRITICAL: Ensure cookies are passed through
            proxy_buffering off;
            proxy_pass_request_headers on;
        }
    }
}
