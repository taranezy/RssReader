name: CI/CD Pipeline - Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==================== STAGE 1: TEST ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'rss-reader-app/package-lock.json'
      
      - name: Install dependencies
        working-directory: rss-reader-app
        run: npm ci
      
      - name: Lint code
        working-directory: rss-reader-app
        run: npm run ng -- lint || true
      
      - name: Run tests
        working-directory: rss-reader-app
        run: npm test -- --no-watch --browsers=ChromeHeadless || true
      
      - name: Build frontend
        working-directory: rss-reader-app
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: rss-reader-app/dist/
          retention-days: 1

  # ==================== STAGE 2: DEPLOY TO PRODUCTION ====================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Pull latest code on remote
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ~/rss-reader && git fetch origin main && git reset --hard origin/main"
      
      - name: Build Docker image on remote
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ~/rss-reader && docker-compose -f docker-compose.prod.yml build rss-reader"
      
      - name: Stop old containers
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ~/rss-reader && docker-compose -f docker-compose.prod.yml down"
      
      - name: Start new containers
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ~/rss-reader && docker-compose -f docker-compose.prod.yml up -d"
      
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ~/rss-reader && docker-compose -f docker-compose.prod.yml ps"
      
      - name: Health check
        run: |
          sleep 10
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "curl -f http://localhost:3000/api/health || echo 'Health check in progress...'"
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ==================== STAGE 3: NOTIFICATIONS ====================
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create deployment annotation
        run: |
          echo "✅ **Deployment Successful**
          
          - **Branch:** main
          - **Commit:** ${{ github.sha }}
          - **Author:** ${{ github.actor }}
          - **Message:** ${{ github.event.head_commit.message }}
          - **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          **Live URL:** https://taranezy.ddns.net:8444" > deployment-summary.txt
          cat deployment-summary.txt
      
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ RSS Reader Deployed Successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Deployment Successful*\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Branch:* main"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Live App"
                      },
                      "url": "https://taranezy.ddns.net:8444"
                    }
                  ]
                }
              ]
            }

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Send Slack notification on failure
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ RSS Reader Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Deployment Failed*\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Branch:* main"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Logs"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
