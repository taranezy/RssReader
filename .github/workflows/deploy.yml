name: CI/CD Pipeline - Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==================== STAGE 1: TEST ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'rss-reader-app/package-lock.json'
      
      - name: Install dependencies
        working-directory: rss-reader-app
        run: npm ci
      
      - name: Lint code
        working-directory: rss-reader-app
        run: npm run ng -- lint || true
      
      - name: Run tests
        working-directory: rss-reader-app
        run: npm test -- --no-watch --browsers=ChromeHeadless || true
      
      - name: Build frontend
        working-directory: rss-reader-app
        run: npm run build:prod
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: rss-reader-app/dist/
          retention-days: 1

  # ==================== STAGE 2: BUILD DOCKER IMAGE (SKIPPED - Build on remote) ====================
  # Docker image is built on the remote server during deployment, not in GitHub Actions
  # This reduces build time and uses remote server's Docker cache

  # ==================== STAGE 3: DEPLOY TO PRODUCTION ====================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check secrets
        run: |
          echo "Checking if secrets are set..."
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "ERROR: DEPLOY_HOST secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "ERROR: DEPLOY_USER secret is not set!"
            exit 1
          fi
          echo "✅ All required secrets are set!"
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>&1
          echo "Host *" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      
      - name: Pull latest code on remote
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          # Backup existing .env file before pulling new code
          if [ -f ~/rss-reader/.env ]; then
            echo "Backing up existing .env file..."
            cp ~/rss-reader/.env ~/rss-reader/.env.backup
          fi
          
          cd ~/rss-reader
          git fetch origin main
          git reset --hard origin/main
          
          # Restore .env file from backup
          if [ -f ~/rss-reader/.env.backup ]; then
            echo "Restoring .env file from backup..."
            mv ~/rss-reader/.env.backup ~/rss-reader/.env
          fi
          
          # Ensure .env file exists
          if [ ! -f .env ]; then
            echo "Creating .env file from .env.example..."
            cp rss-reader-app/.env.example .env || true
            echo "⚠️  WARNING: Please configure .env file with production values!"
          fi
          
          # Create reverse-proxy network if it doesn't exist
          docker network create reverse-proxy 2>/dev/null || true
          EOF
      
      - name: Build Docker image on remote
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ~/rss-reader && docker build -t rss-reader:latest ./rss-reader-app --no-cache"
      
      - name: Stop and remove old containers
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ~/rss-reader && docker-compose -f docker-compose-update.yml down --remove-orphans || true"
      
      - name: Start new containers
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ~/rss-reader && docker-compose -f docker-compose-update.yml up -d"
      
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ~/rss-reader && docker-compose -f docker-compose-update.yml ps"
      
      - name: Health check
        run: |
          sleep 10
          ssh -i ~/.ssh/id_rsa ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "curl -f http://localhost:3000/api/health || echo 'Health check in progress...'"
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

  # ==================== STAGE 4: NOTIFICATIONS ====================
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Log deployment success
        run: echo "✅ Deployment successful!"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Log deployment failure
        run: echo "❌ Deployment failed!"
