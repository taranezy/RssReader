# Host nginx proxy configuration for RSS Reader
# This proxies traffic from the host nginx to the Docker containers

upstream docker_rss_reader {
    # The Docker backend is accessible directly from host on port 3000
    server 127.0.0.1:3000;
}

upstream docker_rss_nginx {
    # The Docker nginx is accessible from host on port 8443 (mapped from container 443)
    server 127.0.0.1:8443;
}

server {
    listen 80;
    server_name streamlet.taranezy.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name streamlet.taranezy.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/streamlet.taranezy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streamlet.taranezy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # RSS Reader at /streamlet - proxy directly to backend
    location /streamlet/ {
        rewrite ^/streamlet/(.*)$ /$1 break;
        
        proxy_pass http://docker_rss_reader;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Path /streamlet;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_pass_request_headers on;
    }

    # ACME challenges for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
