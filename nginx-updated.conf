events {
    worker_connections 1024;
}

http {
    upstream rss-reader {
        server rss-reader-app:3000;
    }

    upstream portainer {
        server portainer:9443;
    }

    server {
        listen 8444 default_server;
        server_name taranezy.ddns.net;

        # ACME challenge for certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # RSS Reader
        location / {
            proxy_pass http://rss-reader;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # CRITICAL: Ensure cookies are passed through
            proxy_buffering off;
            proxy_pass_request_headers on;
        }

        # Portainer
        location /portainer/ {
            proxy_pass https://portainer/;
            
            # Headers for WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts for Portainer operations
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;
            
            # SSL verification - disable for self-signed certificates
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
        }
    }
}
