version: '3.8'

services:
  # RSS Reader Application
  rss-reader:
    build:
      context: ./rss-reader-app
      dockerfile: Dockerfile
    container_name: rss-reader-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=${FRONTEND_URL:-https://streamlet.taranezy.com/}
      - SESSION_SECRET=${SESSION_SECRET:-your-secret-key-change-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-https://streamlet.taranezy.com/api/auth/google/callback}
    volumes:
      - rss-data:/app/backend/data
      - ./rss-reader-app/.env:/app/.env:ro
    networks:
      - rss-network

  # Nextcloud Application
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud-app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-changeme}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS:-nextcloud.taranezy.com}
    volumes:
      - nextcloud-data:/var/www/html
      - nextcloud-config:/var/www/html/config
    networks:
      - rss-network

  # Portainer Application
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer-app
    restart: unless-stopped
    ports:
      - "9443:9443"
    environment:
      - TZ=Europe/Paris
    volumes:
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rss-network

  # Vaultwarden Application
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:-your-admin-token}
      - DOMAIN=https://vaultwarden.taranezy.com
    volumes:
      - vaultwarden-data:/data
    networks:
      - rss-network

  # Shared Nginx Proxy
  nginx:
    image: nginx:latest
    container_name: multi-site-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8444:8444"
    volumes:
      - ./nginx/nginx-multi-site.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - rss-network
    depends_on:
      - rss-reader
      - nextcloud
      - portainer
      - vaultwarden
    entrypoint: /bin/sh /entrypoint.sh

volumes:
  rss-data:
    driver: local
  nextcloud-data:
    driver: local
  nextcloud-config:
    driver: local
  portainer-data:
    driver: local
  vaultwarden-data:
    driver: local
  certbot-webroot:
    driver: local

networks:
  rss-network:
    driver: bridge